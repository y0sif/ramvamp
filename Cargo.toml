[workspace]
resolver = "2"
members = ["crates/core", "crates/repack", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/y0sif/ramvamp"
authors = ["y0sif"]
rust-version = "1.85"

[workspace.dependencies]
# Internal
ramvamp-core = { path = "crates/core" }
ramvamp-repack = { path = "crates/repack" }
ramvamp-server = { path = "crates/server" }

# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization and integrity
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Model I/O (source format is GGUF; parsing is implemented in-repo, see docs/architecture.md)
memmap2 = "0.9"
io-uring = "0.7"
rustix = { version = "1", features = ["thread", "process", "mm"] }
# mincore/posix_fadvise for the O_DIRECT capability probe: rustix exposes
# neither, and libc is already in the tree via memmap2.
libc = "0.2"
tokenizers = "0.21"

# Repacker HTTP (ranged downloads; rustls, no OpenSSL)
ureq = { version = "3", features = ["rustls"] }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Fast-ish debug builds for kernel iteration
[profile.dev]
opt-level = 1

[profile.bench]
debug = true
