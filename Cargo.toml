[workspace]
resolver = "2"
members = ["crates/core", "crates/repack", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/y0sif/ramvamp"
homepage = "https://github.com/y0sif/ramvamp"
# Inherited `readme` paths resolve against the workspace root, so all four
# crates ship the same top-level README to crates.io.
readme = "README.md"
authors = ["y0sif"]
# Edition 2024 needs 1.85, but `ratatui` 0.30 (the `chat --tui` panel, CLI only)
# needs 1.88, and cargo resolves the floor across the whole workspace. Declared
# honestly rather than aspirationally: CI builds this floor on every push.
rust-version = "1.88"

[workspace.dependencies]
# Internal. Each carries both a `path` and a `version`: the path wins for local
# builds, and `cargo publish` rejects a path dependency that has no version.
ramvamp-core = { path = "crates/core", version = "0.1.0" }
ramvamp-repack = { path = "crates/repack", version = "0.1.0" }
ramvamp-server = { path = "crates/server", version = "0.1.0" }

# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization and integrity
serde = { version = "1", features = ["derive"] }
# `preserve_order` swaps serde_json's object map from BTreeMap to IndexMap
# workspace-wide, so `Value` round-trips keep the input's key order. Chat
# templates render tool schemas with Python's `json.dumps`, which emits
# insertion order; sorting them would silently change the prompt the model
# sees (see `tokenizer::pyjson`).
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

# Model I/O (source format is GGUF; parsing is implemented in-repo, see docs/architecture.md)
memmap2 = "0.9"
io-uring = "0.7"
rustix = { version = "1", features = ["thread", "process", "mm"] }
# mincore/posix_fadvise for the O_DIRECT capability probe: rustix exposes
# neither, and libc is already in the tree via memmap2.
libc = "0.2"
tokenizers = "0.21"

# Repacker HTTP (ranged downloads; rustls, no OpenSSL)
ureq = { version = "3", features = ["rustls"] }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Fast-ish debug builds for kernel iteration
[profile.dev]
opt-level = 1

[profile.bench]
debug = true
