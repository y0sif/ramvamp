[package]
name = "ramvamp"
description = "Run 26-30B fine-grained MoE models in about 3 GB of RAM by streaming experts from NVMe. No GPU required."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
rust-version.workspace = true
# No `documentation`: this crate is bin-only, so a docs.rs link would point at
# an empty page. The README and the repository are the documentation.
keywords = ["llm", "inference", "moe", "nvme", "quantization"]
categories = ["command-line-utilities", "science", "filesystem"]

[[bin]]
name = "ramvamp"
path = "src/main.rs"

[dependencies]
ramvamp-core = { workspace = true }
# `serve` is the OpenAI-compatible HTTP surface. The transport lives there,
# not here: this crate contributes the flags and the loaded model.
ramvamp-server = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# `tracing` beside the subscriber this binary already installs: the TUI's
# agent layer reports a failure to bind its socket at debug level rather
# than on stderr, because nobody running `chat --tui` asked for that socket.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
# `chat` installs a SIGINT handler so Ctrl-C stops a reply instead of the
# process. Not a new dependency in the tree: `libc` is already a workspace
# dependency (see the root Cargo.toml), and the alternatives (ctrlc,
# signal-hook) would be.
libc = { workspace = true }
# `tui` draws the pinned status panel. Default features are off on purpose:
# the only backend we want is crossterm, and `scrolling-regions` is
# deliberately *not* enabled because it only changes `Terminal::insert_before`,
# which this crate never calls. crossterm itself is not listed here — it comes
# in through ratatui and is used via the `ratatui::crossterm` re-export, so the
# tree cannot end up with two versions of it.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
taria-ratatui = "0.2"
